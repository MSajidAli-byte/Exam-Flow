services:
  backend:
    build:
      context: ./services/backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PHASE=${PHASE:-1}  # Default to Phase 1 (stable), set PHASE=2 for Agentic AI
      - AGENTIC_MODE=${AGENTIC_MODE:-off}  # Enable with AGENTIC_MODE=on
    volumes:
      - ./services/backend:/app
      - .:/project_root
      - chroma_db:/app/chroma_db  # Persistent storage for RAG vector database
      - uploads:/app/uploads  # Persistent storage for uploaded videos
    restart: always

  frontend:
    build:
      context: ./services/frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - PHASE=${PHASE:-1}
    volumes:
      - ./services/frontend:/app
      - .:/project_root
    depends_on:
      - backend
    restart: always

volumes:
  video_data:
  chroma_db:  # Named volume for ChromaDB persistence (Phase 2)
  uploads:    # Named volume for video uploads
